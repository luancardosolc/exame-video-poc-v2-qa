      function _isInteractiveTarget(target) {
        const interactive = target?.closest?.(
          'button, a, [role="button"], [data-interactive="true"]',
        );
        return Boolean(
          interactive && !interactive.classList.contains("gesture-zone"),
        );
      }

      function handleDetailsHeaderTap(event) {
        if (_isInteractiveTarget(event.target)) return;
        const rect = event.currentTarget.getBoundingClientRect();
        const x = event.clientX - rect.left;
        if (x < rect.width / 3) DetailsPanel.previous();
        else if (x > (2 * rect.width) / 3) DetailsPanel.next();
      }

      let _mainHoldWasHold = false;

      function setupMainHoldPause() {
        const app = document.getElementById("app");
        if (!app) return;

        const HOLD_MS = 200;
        const MOVE_THRESHOLD = 10;
        let _timer = null;
        let _holdActive = false;
        let _startX = 0, _startY = 0;

        app.addEventListener("touchstart", function (e) {
          if (DetailsPanel.isOpen()) return;
          if (_isInteractiveTarget(e.target)) return;
          if (e.touches.length !== 1) return;
          _mainHoldWasHold = false;
          _holdActive = false;
          if (_timer) { clearTimeout(_timer); _timer = null; }
          _startX = e.touches[0].clientX;
          _startY = e.touches[0].clientY;
          _timer = setTimeout(function () {
            _timer = null;
            if (!State.isPlaying) return;
            _holdActive = true;
            _mainHoldWasHold = true;
            PlayerFactory.pause();
          }, HOLD_MS);
        }, { passive: true });

        app.addEventListener("touchmove", function (e) {
          if (!_timer) return;
          if (e.touches.length !== 1) return;
          var dx = Math.abs(e.touches[0].clientX - _startX);
          var dy = Math.abs(e.touches[0].clientY - _startY);
          if (dx > MOVE_THRESHOLD || dy > MOVE_THRESHOLD) {
            clearTimeout(_timer);
            _timer = null;
            _mainHoldWasHold = false;
          }
        }, { passive: true });

        app.addEventListener("touchend", function () {
          if (_timer) { clearTimeout(_timer); _timer = null; }
          if (_holdActive) {
            _holdActive = false;
            PlayerFactory.play();
          }
        }, { passive: true });

        app.addEventListener("touchcancel", function () {
          if (_timer) { clearTimeout(_timer); _timer = null; }
          if (_holdActive) {
            _holdActive = false;
            PlayerFactory.play();
          }
          _mainHoldWasHold = false;
        }, { passive: true });
      }

      function handleStoryNavigationTap(event, direction) {
        if (_isInteractiveTarget(event.target)) return;
        if (_mainHoldWasHold) { _mainHoldWasHold = false; return; }
        if (direction !== "previous" && direction !== "next") return;

        if (DetailsPanel.isOpen()) {
          if (direction === "next") DetailsPanel.next();
          else DetailsPanel.previous();
          return;
        }

        sendStoryNavigation(direction);
      }

      function sendStoryNavigation(direction) {
        if (DetailsPanel.isOpen()) DetailsPanel.close();
        AppBridge.send("story:navigate", {
          direction,
          storyId: State.payload?.story.id,
          storySlug: State.payload?.story.slug,
        });
        Logger.log("story navigate", direction);
      }

      const STORY_SWIPE_DISTANCE_THRESHOLD = 64;
      const STORY_SWIPE_DIRECTION_RATIO = 1.25;
      let _storySwipeStart = null;

      function setupStoryNavigationSwipe() {
        const app = document.getElementById("app");
        if (!app) return;

        app.addEventListener(
          "touchstart",
          (event) => {
            if (event.touches.length !== 1) {
              _storySwipeStart = null;
              return;
            }
            if (_isInteractiveTarget(event.target)) {
              _storySwipeStart = null;
              return;
            }

            const touch = event.touches[0];
            _storySwipeStart = {
              x: touch.clientX,
              y: touch.clientY,
            };
          },
          { passive: true },
        );

        app.addEventListener(
          "touchend",
          (event) => {
            if (!_storySwipeStart || event.changedTouches.length !== 1) return;

            const touch = event.changedTouches[0];
            const dx = touch.clientX - _storySwipeStart.x;
            const dy = touch.clientY - _storySwipeStart.y;
            _storySwipeStart = null;

            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);
            if (
              absDx < STORY_SWIPE_DISTANCE_THRESHOLD ||
              absDx <= absDy * STORY_SWIPE_DIRECTION_RATIO
            ) {
              return;
            }

            event.preventDefault();
            sendStoryNavigation(dx < 0 ? "next" : "previous");
          },
          { passive: false },
        );

        app.addEventListener("touchcancel", () => {
          _storySwipeStart = null;
        });
      }

      function _updateBtnPlay() {
        const btn = document.getElementById("btn-play");
        if (btn) btn.textContent = State.isPlaying ? "⏸" : "▶";
      }

      const _SVG_MUTED = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>';
      const _SVG_UNMUTED = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';

      function _updateBtnMute() {
        const btn = document.getElementById("btn-mute");
        if (btn) btn.innerHTML = State.isMuted ? _SVG_MUTED : _SVG_UNMUTED;
      }


      const VideoProgressBar = (function () {
        let _live = false;

        function _track() { return document.getElementById("video-progress-track"); }
        function _fill()  { return document.getElementById("video-progress-fill"); }

        function configure(isLive) {
          _live = isLive;
          const track = _track();
          if (track) track.style.display = isLive ? "none" : "";
        }

        function setProgress(pct) {
          if (_live) return;
          const fill = _fill();
          if (fill) fill.style.transform = `scaleX(${Math.max(0, Math.min(1, pct))})`;
        }

        function reset() {
          const fill = _fill();
          if (!fill) return;
          fill.style.transition = "none";
          fill.style.transform = "scaleX(0)";
          fill.offsetWidth; // reflow para garantir que a transition seja desligada antes do reset
          fill.style.transition = "";
        }

        function hide() {
          const track = _track();
          if (track) track.style.display = "none";
        }

        function show() {
          if (_live) return;
          const track = _track();
          if (track) track.style.display = "";
        }

        return { configure, setProgress, reset, hide, show };
      })();

      const DetailsPanel = (function () {
        let _details = null;
        let _activeIndex = 0;
        let _autoTimer = null;
        let _timerAttempts = 0;
        let _timerStarted = 0;
        let _remainingTime = 0;

        const AUTO_PROGRESS_MS = 5000;
        const MAX_TIMER_RETRIES = 5; // máx ~25s extra antes de avançar forçado

        function _setVisible(id, show) {
          const el = document.getElementById(id);
          if (el) el.style.display = show ? "" : "none";
        }

        function _renderSlide(index) {
          _activeIndex = index;
          const slides = _details?.slides ?? [];
          const slide = slides[Math.min(index, slides.length - 1)];

          // Reseta scroll ao topo ao trocar de slide
          const scrollEl = document.getElementById("details-scroll");
          if (scrollEl) scrollEl.scrollTop = 0;

          const bodyEl = document.getElementById("details-body");
          if (bodyEl) {
            const html = slide?.contentHtml ?? "";
            const text = slide?.plainText ?? "";
            if (html.trim()) {
              // Conteúdo HTML rico — fonte confiável (backend Exame)
              bodyEl.innerHTML = html;
              bodyEl.style.display = "";
            } else if (text.trim()) {
              bodyEl.textContent = text;
              bodyEl.style.display = "";
            } else {
              bodyEl.innerHTML = "";
              bodyEl.style.display = "none";
            }
          }

          const pagEl = document.getElementById("details-pagination");
          if (pagEl) {
            const bars = pagEl.querySelectorAll(".details-pag-bar");
            bars.forEach((bar, i) => {
              if (i === index) {
                bar.classList.remove("active");
                bar.offsetWidth; // reflow para reiniciar a animação
                bar.classList.add("active");
              } else {
                bar.classList.remove("active");
              }
            });
          }
        }

        function _buildPagination(slides) {
          const pagEl = document.getElementById("details-pagination");
          if (!pagEl) return;
          pagEl.innerHTML = "";
          if (slides.length < 2) {
            pagEl.style.display = "none";
            return;
          }
          slides.forEach((_, i) => {
            const btn = document.createElement("button");
            btn.className = "details-pag-bar" + (i === 0 ? " active" : "");
            btn.setAttribute("aria-label", `Abrir detalhe ${i + 1}`);
            btn.setAttribute("data-interactive", "true");
            btn.addEventListener("click", () => { _renderSlide(i); _startTimer(); });
            pagEl.appendChild(btn);
          });
          pagEl.style.display = "flex";
        }

        function _buildAuthor(author) {
          const rowEl = document.getElementById("details-author-row");
          if (!rowEl) return;
          if (!author?.name) {
            rowEl.style.display = "none";
            return;
          }
          rowEl.innerHTML = "";
          if (author.avatarUrl) {
            const img = document.createElement("img");
            img.className = "details-avatar";
            img.src = author.avatarUrl;
            img.alt = author.name;
            rowEl.appendChild(img);
          } else {
            const fallback = document.createElement("div");
            fallback.className = "details-avatar-fallback";
            fallback.textContent = author.name.charAt(0).toUpperCase();
            rowEl.appendChild(fallback);
          }
          const textBlock = document.createElement("div");
          textBlock.className = "details-author-text";
          const nameEl = document.createElement("span");
          nameEl.className = "details-author-name";
          nameEl.textContent = author.name;
          textBlock.appendChild(nameEl);
          if (author.role) {
            const roleEl = document.createElement("span");
            roleEl.className = "details-author-role";
            roleEl.textContent = author.role;
            textBlock.appendChild(roleEl);
          }
          rowEl.appendChild(textBlock);
          rowEl.style.display = "flex";
        }

        function open(details, storyTitle) {
          _details = details;
          _activeIndex = 0;

          const heroBg = document.getElementById("details-hero-bg");
          if (heroBg) {
            heroBg.style.backgroundImage = details.headerImageUrl
              ? `url("${details.headerImageUrl.replace(/"/g, "%22")}")`
              : "";
          }

          const heroTitle = document.getElementById("details-hero-title");
          if (heroTitle) heroTitle.textContent = storyTitle ?? "";

          const titleEl = document.getElementById("details-title");
          if (titleEl) titleEl.textContent = storyTitle ?? "";

          _buildAuthor(details.author);
          _buildPagination(details.slides);
          _renderSlide(0);

          const panel = document.getElementById("details-panel");
          if (panel) {
            panel.removeAttribute("aria-hidden");
            panel.classList.add("open");
          }

          const scrollEl = document.getElementById("details-scroll");
          if (scrollEl) scrollEl.scrollTop = 0;

          _startTimer();
          Logger.log("details panel aberto");
        }

        function close() {
          _clearTimer();
          const panel = document.getElementById("details-panel");
          if (panel) {
            panel.setAttribute("aria-hidden", "true");
            panel.classList.remove("open");
          }
          _details = null;
          Logger.log("details panel fechado");
        }

        function _clearTimer() {
          if (_autoTimer) { clearTimeout(_autoTimer); _autoTimer = null; }
        }

        function _advanceOrClose() {
          const slides = _details?.slides ?? [];
          if (_activeIndex < slides.length - 1) {
            _renderSlide(_activeIndex + 1);
            _startTimer();
          } else {
            handleCloseDetails();
          }
        }

        function _isAtScrollBottom() {
          const el = document.getElementById("details-scroll");
          if (!el) return true;
          return el.scrollTop + el.clientHeight >= el.scrollHeight - 16;
        }

        function _scheduleCheck(delay) {
          var ms = (delay !== undefined) ? delay : AUTO_PROGRESS_MS;
          _remainingTime = ms;
          _timerStarted = Date.now();
          _autoTimer = setTimeout(function () {
            _autoTimer = null;
            if (_isAtScrollBottom() || _timerAttempts >= MAX_TIMER_RETRIES) {
              _advanceOrClose();
            } else {
              _timerAttempts++;
              _scheduleCheck();
            }
          }, ms);
        }

        function _startTimer() {
          _clearTimer();
          _timerAttempts = 0;
          _scheduleCheck();
        }

        function pause() {
          if (!_details) return;
          if (_autoTimer) {
            var elapsed = Date.now() - _timerStarted;
            _remainingTime = Math.max(300, _remainingTime - elapsed);
            clearTimeout(_autoTimer);
            _autoTimer = null;
          }
          document.querySelectorAll(".details-pag-bar").forEach(function (bar) {
            bar.classList.add("paused");
          });
        }

        function resume() {
          if (!_details) return;
          document.querySelectorAll(".details-pag-bar").forEach(function (bar) {
            bar.classList.remove("paused");
          });
          if (!_autoTimer) _scheduleCheck(_remainingTime);
        }

        function isOpen() { return _details !== null; }

        function next() {
          const slides = _details?.slides ?? [];
          if (_activeIndex < slides.length - 1) {
            _renderSlide(_activeIndex + 1);
            _startTimer();
          } else {
            handleCloseDetails();
          }
        }

        function previous() {
          if (_activeIndex > 0) {
            _renderSlide(_activeIndex - 1);
            _startTimer();
          }
        }

        return { open, close, isOpen, next, previous, pause, resume };
      })();

      function handleOpenDetails() {
        const details = State.payload?.details;
        if (!details) return;
        PlayerFactory.pause();
        State.isPlaying = false;
        _updateBtnPlay();
        VideoProgressBar.hide();
        DetailsPanel.open(details, State.payload?.overlay?.title ?? State.payload?.story?.title);
        AppBridge.send("analytics", {
          event: "story_details_opened",
          data: { storyId: State.payload?.story?.id, storySlug: State.payload?.story?.slug },
        });
      }

      function handleCloseDetails() {
        DetailsPanel.close();
        VideoProgressBar.show();
        PlayerFactory.play();
        State.isPlaying = true;
        _updateBtnPlay();
        AppBridge.send("analytics", {
          event: "story_details_closed",
          data: { storyId: State.payload?.story?.id, storySlug: State.payload?.story?.slug },
        });
      }

      let _toastTimer;
      function showToast(msg) {
        const el = document.getElementById("toast");
        if (!el) return;
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(_toastTimer);
        _toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
      }

      window.addEventListener("resize", () => {
        if (State.payload) VideoCover.resize(State.payload.media.aspectRatio);
      });
      window.addEventListener("orientationchange", () => {
        if (State.payload) VideoCover.resize(State.payload.media.aspectRatio);
      });

      const KnowledgePillMode = (function () {
        function parseVimeoUrl(input) {
          if (!input || typeof input !== "string") {
            throw new Error("videoUrl é obrigatório.");
          }

          const url = new URL(input);
          const host = url.hostname.replace(/^www\./, "").toLowerCase();
          if (host !== "vimeo.com" && host !== "player.vimeo.com") {
            throw new Error("videoUrl deve ser uma URL do Vimeo.");
          }

          const parts = url.pathname.split("/").filter(Boolean);
          const videoId =
            host === "player.vimeo.com" && parts[0] === "video"
              ? parts[1]
              : parts[0];
          const pathHash =
            host === "player.vimeo.com" && parts[0] === "video"
              ? parts[2]
              : parts[1];
          const vimeoHash = url.searchParams.get("h") || pathHash || "";

          if (!videoId || !/^\d+$/.test(videoId)) {
            throw new Error("ID do Vimeo não encontrado na videoUrl.");
          }

          return { videoId, vimeoHash };
        }

        function createPayload() {
          const params = new URLSearchParams(window.location.search);
          const slug = params.get("slug") || "knowledge-pill";
          const videoUrl = params.get("videoUrl") || "";
          const startAt = Number(params.get("startAt") || 0);
          const vimeo = parseVimeoUrl(videoUrl);

          return {
            version: 1,
            story: {
              id: slug,
              slug,
              title: "Pílula de conteúdo",
            },
            media: {
              provider: "vimeo",
              videoId: vimeo.videoId,
              sourceUrl: videoUrl,
              vimeoHash: vimeo.vimeoHash,
              startAt: Number.isFinite(startAt) && startAt > 0 ? Math.floor(startAt) : 0,
              aspectRatio: "16:9",
              autoplay: true,
              muted: false,
              loop: false,
            },
            overlay: {
              title: "",
            },
            behavior: {
              allowFullscreenToggle: false,
              knowledgePillMode: true,
            },
          };
        }

        function init() {
          try {
            const payload = createPayload();
            const encoded = PayloadCodec.encode(payload);
            __handlePayload(encoded);
          } catch (e) {
            const message = e?.message ?? "Falha ao preparar vídeo da pílula.";
            OverlayRenderer.showError("Vídeo indisponível", message);
            AppBridge.sendRaw({
              type: "PLAYER_ERROR",
              slug: new URLSearchParams(window.location.search).get("slug") || "",
              progress: 0,
              duration: 0,
              status: "in_progress",
              code: "VIMEO_LOAD_ERROR",
              message,
            });
          }
        }

        return { init };
      })();

      function setupDetailsTouchBehavior() {
        const panel = document.getElementById("details-panel");
        const scrollEl = document.getElementById("details-scroll");
        if (!panel || !scrollEl) return;

        var _startX = 0, _startY = 0;
        var _didScroll = false;
        var _isHolding = false;
        var _holdTimer = null;
        const HOLD_MS = 200;

        function _cancelHold() {
          if (_holdTimer) { clearTimeout(_holdTimer); _holdTimer = null; }
          if (_isHolding) {
            _isHolding = false;
            DetailsPanel.resume();
          }
        }

        // Detecta início do toque em qualquer parte do painel
        panel.addEventListener("touchstart", function (e) {
          if (!DetailsPanel.isOpen()) return;
          _startX = e.touches[0].clientX;
          _startY = e.touches[0].clientY;
          _didScroll = false;
          _holdTimer = setTimeout(function () {
            _holdTimer = null;
            _isHolding = true;
            DetailsPanel.pause();
          }, HOLD_MS);
        }, { passive: true });

        // Scroll cancela o hold timer (mas mantém pausado se já estava)
        scrollEl.addEventListener("scroll", function () {
          _didScroll = true;
          if (_holdTimer) { clearTimeout(_holdTimer); _holdTimer = null; }
        }, { passive: true });

        // Fim do toque: resume se estava holding; caso contrário testa tap lateral no corpo
        panel.addEventListener("touchend", function (e) {
          var wasHolding = _isHolding;
          _cancelHold();
          if (wasHolding) return;
          if (!DetailsPanel.isOpen() || _didScroll) return;
          if (!scrollEl.contains(e.target)) return; // tap lateral só no corpo
          var touch = e.changedTouches[0];
          var dx = Math.abs(touch.clientX - _startX);
          var dy = Math.abs(touch.clientY - _startY);
          if (dy >= 8 || dx >= 30) return;
          if (_isInteractiveTarget(e.target)) return;
          var width = scrollEl.getBoundingClientRect().width;
          if (touch.clientX < width / 3) DetailsPanel.previous();
          else if (touch.clientX > (2 * width) / 3) DetailsPanel.next();
        }, { passive: true });

        panel.addEventListener("touchcancel", function () {
          _cancelHold();
        }, { passive: true });
      }

      function init() {
        if (AppBridge.isInWebView()) {
          document.body.classList.add("in-webview");
        }

        AppBridge.registerEntrypoint(__handlePayload);
        setupStoryNavigationSwipe();
        setupMainHoldPause();
        setupDetailsTouchBehavior();

        const mode = new URLSearchParams(window.location.search).get("mode");
        if (mode === "knowledge-pill") {
          Logger.log("modo knowledge-pill via query param");
          KnowledgePillMode.init();
          return;
        }

        const paramEncoded = new URLSearchParams(window.location.search).get(
          "payload",
        );
        if (paramEncoded) {
          Logger.log("modo browser: payload via query param");
          __handlePayload(paramEncoded);
          AppBridge.send("ready");
          return;
        }

        AppBridge.send("ready");
        Logger.log("pronto, aguardando payload do app");
      }

      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
